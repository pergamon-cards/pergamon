[package]
name = "pergamon"
version = "0.2.0-alpha.1"
authors = ["Matthew Waymost <matthew@waymost.net>"]
edition = "2024"

[dependencies]
anyhow = "1.0"
config = { version = "0.15", features = ["toml"] }
once_cell = "1.18"
poise = "0.6"
pyo3 = { version = "0.28", features = ["auto-initialize"] }
pythonize = "0.28"
regex = "1.12"
rune = "0.14.1"
rune-modules = { version = "0.14.1", features = ["json"] }
serde = "1.0"
serde_json = "1.0"
serenity = { version = "0.12", features = ["collector", "model"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "migrate", "tls-rustls-ring-webpki", "postgres"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
